    <rect x="294" y="108" width="612" height="687" fill="none" stroke="#c77b56" stroke-width="1.5"/>
    <text x="340" y="166" fill="#9b4635" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="5">PASAR KREATIF / 2026</text>
    <text x="340" y="254" fill="#263d33" font-family="Georgia,serif" font-size="76" font-weight="700">Ruang</text>
    <text x="340" y="330" fill="#263d33" font-family="Georgia,serif" font-size="76" font-style="italic">Rasa.</text>
    <text x="344" y="374" fill="#765e4c" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">CERITA LOKAL, RASA YANG DEKAT</text>
    <circle cx="630" cy="560" r="155" fill="#d9714d"/>
    <circle cx="630" cy="560" r="126" fill="#f0b96f"/>
    <circle cx="630" cy="560" r="91" fill="#f8e6bf"/>
    <path d="M630 470c20-36 58-43 77-30-10 31-37 45-77 42m-3 5c-10-37-43-51-67-40 4 33 26 52 67 53" fill="#637b50"/>
    <path d="M529 584c30-13 57-10 82 7m35 5c27-16 54-18 83-6" fill="none" stroke="#c75b3d" stroke-width="8" stroke-linecap="round"/>
    <text x="342" y="745" fill="#263d33" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">POSTER / SOCIAL CAMPAIGN / PRINT</text>
