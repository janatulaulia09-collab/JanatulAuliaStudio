<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Studi konsep poster Ruang Rasa</title>
  <desc id="desc">Poster kampanye kuliner dengan komposisi tipografi berani dan bentuk geometris hangat.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f0b879"/>
      <stop offset="1" stop-color="#db7958"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#fcf1da"/>
      <stop offset="1" stop-color="#f3d9b2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#74402f" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#background)"/>
  <circle cx="100" cy="760" r="250" fill="#f8d99a" opacity=".42"/>
  <circle cx="1110" cy="120" r="190" fill="#a84638" opacity=".3"/>
