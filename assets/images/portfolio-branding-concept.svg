    <rect x="145" y="145" width="590" height="610" rx="3" fill="none" stroke="#d7c8ae"/>
    <circle cx="440" cy="338" r="94" fill="#e6d9c2"/>
    <path d="M443 420c-6-88 20-158 82-213m-80 143c-47-57-91-59-125-44 13 52 54 78 125 67m20-75c39-54 80-63 121-42-10 48-49 77-113 84m-27 71c-29-35-65-43-103-27 10 41 43 63 98 57m72-39c31-38 66-45 106-26-10 41-43 63-100 58" fill="none" stroke="#426c50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
