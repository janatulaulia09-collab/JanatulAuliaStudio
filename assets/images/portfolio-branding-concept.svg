    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#95a979"/>
      <stop offset="1" stop-color="#426c50"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#102c23" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#background)"/>
  <circle cx="1050" cy="140" r="220" fill="#d2a46e" opacity=".16"/>
  <circle cx="1050" cy="140" r="148" fill="none" stroke="#f4e8d5" stroke-opacity=".28"/>
  <path d="M0 690c240-110 350-70 520 30s380 140 680 0v180H0Z" fill="#15392e" opacity=".65"/>
