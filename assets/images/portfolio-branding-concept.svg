<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Studi konsep identitas Rona Botanika</title>
  <desc id="desc">Mockup identitas visual botani dengan palet hijau hutan, krem, dan aksen jeruk.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
